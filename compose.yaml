services:
  app:
    build:
      context: .
      target: app
    image: ai-lead-agent:local
    env_file: .env
    environment: &environment
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-ai_lead_agent}
      DB_USERNAME: ${DB_USERNAME:-ai_lead_agent}
      DB_PASSWORD: ${DB_PASSWORD:?Set a database password in .env}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes:
      - storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    image: ai-lead-agent-web:local
    ports: ["8080:80"]
    depends_on: [app]
  worker:
    image: ai-lead-agent:local
    env_file: .env
    environment: *environment
    command: ["php", "artisan", "queue:work", "--timeout=900", "--tries=3", "--sleep=3"]
    volumes: ["storage:/var/www/storage"]
    depends_on: [app]
  scheduler:
    image: ai-lead-agent:local
    env_file: .env
    environment: *environment
    command: ["php", "artisan", "schedule:work"]
    volumes: ["storage:/var/www/storage"]
    depends_on: [app]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ai_lead_agent}
      MYSQL_USER: ${DB_USERNAME:-ai_lead_agent}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a database password in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  mysql:
  storage:
