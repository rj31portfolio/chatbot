name: Application checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: ai_lead_agent_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost -ptesting" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci --ignore-scripts && npm run build -- --configLoader runner
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: php artisan test --configuration=phpunit.mysql.xml
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ai_lead_agent_test
          DB_USERNAME: root
          DB_PASSWORD: testing
  render-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: render_test
          POSTGRES_USER: render_test
          POSTGRES_PASSWORD: testing
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U render_test" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Build the Render image
        run: docker build --target render -t chatbot-render .
      - name: Start with Render environment and PostgreSQL
        run: |
          docker run -d --name chatbot-render --network host \
            -e APP_KEY=01234567890123456789012345678901 \
            -e RENDER=true -e PORT=18080 \
            -e RENDER_EXTERNAL_URL=http://127.0.0.1:18080 \
            -e SESSION_SECURE_COOKIE=false \
            -e DATABASE_URL=postgresql://render_test:testing@127.0.0.1:5432/render_test \
            chatbot-render
      - name: Check health, landing page, and widget installation guide
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 http://127.0.0.1:18080/up
          curl --fail --max-time 10 http://127.0.0.1:18080/ > /tmp/landing.html
          test -s /tmp/landing.html
          curl --fail --max-time 10 http://127.0.0.1:18080/widget-installation > /dev/null
          curl --fail --max-time 10 http://127.0.0.1:18080/widget.js > /dev/null
      - name: Show container logs
        if: always()
        run: docker logs chatbot-render
